<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasa — Market Yönetimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1512; --paper:#EFF1EC; --card:#FFFFFF; --line:#D8DED4; --muted:#6B7369;
  --lcd-bg:#0C170F; --lcd:#8CFFAE; --tag:#FFD84A; --red:#B3261E; --green:#1E6B45; --slate:#2F4858;
  --r:10px; --shadow:0 1px 0 rgba(15,21,18,.06), 0 8px 24px -18px rgba(15,21,18,.5);
  --disp:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted)}

/* ---------- shell ---------- */
.app{display:flex;min-height:100dvh}
.rail{width:92px;flex:0 0 92px;background:var(--ink);color:#E7EBE4;display:flex;flex-direction:column;align-items:stretch;padding:14px 8px;gap:4px;position:sticky;top:0;height:100dvh}
.brand{padding:6px 8px 14px;text-align:center}
.brand .bars{display:flex;gap:2px;justify-content:center;align-items:flex-end;height:26px;margin-bottom:6px}
.brand .bars i{display:block;width:2px;background:var(--tag);border-radius:1px}
.brand b{font-family:var(--disp);font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:#fff;display:block}
.navbtn{background:none;border:0;color:#9FAA9C;padding:11px 4px;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;line-height:1}
.navbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{color:#fff;background:#1B2620}
.navbtn.on{color:var(--ink);background:var(--tag)}
.rail .spacer{flex:1}
main{flex:1;min-width:0;padding:22px 26px 40px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:30px;line-height:1}
.head .sub{font-size:13px;color:var(--muted);margin-top:4px}

/* ---------- bits ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 15px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.tag{background:var(--tag);border-color:#E5BE2E;color:var(--ink)}
.btn.danger{background:transparent;color:var(--red);border-color:#E4C7C4}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(15,21,18,.08)}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.row{display:flex;gap:10px}.row>*{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #EDF0EA;vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:#EDF0EA;color:var(--muted);white-space:nowrap}
.chip.warn{background:#FFF3CE;color:#7A5B00}
.chip.bad{background:#FBE9E7;color:var(--red)}
.chip.ok{background:#E4F1E9;color:var(--green)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;font-family:var(--disp);font-size:19px;color:var(--ink);margin-bottom:4px;letter-spacing:.02em}
.scroll{overflow:auto}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:1fr 348px;gap:16px;align-items:start}
.scanbar{display:flex;gap:10px;align-items:center;padding:12px}
.scanbar input{font-family:var(--mono);font-size:17px;letter-spacing:.05em}
.cart{max-height:calc(100dvh - 250px);overflow:auto}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{width:30px;height:30px;border:0;background:#F6F8F4;font-size:16px;line-height:1}
.qty button:hover{background:var(--tag)}
.qty span{min-width:52px;text-align:center;font-family:var(--mono);font-size:14px}
.lcd{background:var(--lcd-bg);border-radius:var(--r);padding:16px 18px;color:var(--lcd);position:relative;overflow:hidden}
.lcd:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);pointer-events:none}
.lcd .lbl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.2em;font-size:11px;color:#4E9C6B}
.lcd .big{font-family:var(--mono);font-weight:700;font-size:40px;line-height:1.1;letter-spacing:-.02em;text-shadow:0 0 14px rgba(140,255,174,.35)}
.lcd .line{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:#5FBE83;margin-top:2px}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay{border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px 8px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:14px}
.pay.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .k{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:23px;font-weight:700;margin-top:5px;letter-spacing:-.02em}
.stat .n{font-size:12px;color:var(--muted);margin-top:2px}
.stat.hl{background:var(--ink);color:#fff}.stat.hl .k,.stat.hl .n{color:#9FAA9C}
.bars7{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.bars7 .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars7 .b i{display:block;width:100%;background:var(--ink);border-radius:3px 3px 0 0;min-height:2px}
.bars7 .b em{font-style:normal;font-size:11px;color:var(--muted);font-family:var(--mono)}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(12,18,15,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:440px;max-height:92dvh;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal.wide{max-width:620px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:19px}
.x{border:0;background:#F1F3EE;width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1}
.mbody{padding:16px}
.mfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* ---------- scanner ---------- */
.cam{position:relative;background:#000;aspect-ratio:4/3;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;left:8%;right:8%;top:26%;height:48%;border:2px solid rgba(255,216,74,.9);border-radius:8px;box-shadow:0 0 0 2000px rgba(0,0,0,.34)}
.laser{position:absolute;left:0;right:0;top:50%;height:2px;background:#FF5B4A;box-shadow:0 0 10px #FF5B4A;animation:sweep 1.9s ease-in-out infinite}
@keyframes sweep{0%,100%{top:8%}50%{top:92%}}
@media (prefers-reduced-motion:reduce){.laser{animation:none}}
.camstate{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.camerr{padding:22px 18px;text-align:center;color:#fff;background:#151C18;font-size:14px}

/* ---------- toast + receipt ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow)}
.toast.bad{background:var(--red)}
#printArea{display:none}

@media (max-width:900px){
  .pos{grid-template-columns:1fr}
  .cart{max-height:none}
}
@media (max-width:760px){
  main{padding:16px 14px 96px}
  .head h1{font-size:25px}
  .app{flex-direction:column}
  .rail{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;z-index:40;border-top:1px solid #26312B}
  .rail .brand,.rail .spacer{display:none}
  .navbtn{flex:1;font-size:10.5px;padding:8px 2px;letter-spacing:.04em}
  .navbtn svg{width:19px;height:19px}
}
@media print{
  body{background:#fff}
  .app,#toast{display:none !important}
  #printArea{display:block !important;font-family:var(--mono);font-size:12px;width:74mm;margin:0 auto}
  #printArea h3{font-family:var(--mono);text-align:center}
  #printArea table{font-size:11px}
  #printArea td,#printArea th{padding:2px 0;border:0}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail">
    <div class="brand"><div class="bars" id="brandbars"></div><b>Kasa</b></div>
    <button class="navbtn on" data-v="pos"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="7" cy="6" r="1.6"/><circle cx="14" cy="12" r="1.6"/><circle cx="10" cy="18" r="1.6"/></svg>Satış</button>
    <button class="navbtn" data-v="stok"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Stok</button>
    <button class="navbtn" data-v="alis"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>Alış</button>
    <button class="navbtn" data-v="muhasebe"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h3M8 15h3M15 11v6M13 14h4"/></svg>Muhasebe</button>
    <button class="navbtn" data-v="rapor"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Rapor</button>
    <div class="spacer"></div>
    <button class="navbtn" data-v="ayar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 14a2 2 0 1 1 0-4 1.6 1.6 0 0 0 1.6-2.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.2V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/></svg>Ayarlar</button>
  </nav>
  <main id="view"></main>
</div>
<div id="modals"></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
/* =========================================================
   0. Yardımcılar
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const TL=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>TL.format(Number(n)||0)+' ₺';
const qtyFmt=(n,u)=>u==='kg'?(Number(n).toFixed(3)+' kg'):(Math.round(n)+' ad');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>(typeof structuredClone==='function'?structuredClone(o):JSON.parse(JSON.stringify(o)));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const dayOf=ts=>new Date(ts).toISOString().slice(0,10);
const dt=ts=>new Date(ts).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
function toast(msg,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=msg;$('#toast').append(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320)},2100);}
function beep(ok=true){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='square';o.frequency.value=ok?1180:320;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.13);o.start();o.stop(c.currentTime+.14);setTimeout(()=>c.close(),400);}catch(e){}}
function vibrate(){try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}

/* =========================================================
   1. Depolama  (artifact içinde window.storage, dışında localStorage)
   ========================================================= */
const Store=(()=>{
  const KEY='market_v1';
  const ws=(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function')?window.storage:null;
  return{
    async load(){
      try{
        if(ws){const r=await ws.get(KEY);return r&&r.value?JSON.parse(r.value):null;}
        const v=localStorage.getItem(KEY);return v?JSON.parse(v):null;
      }catch(e){return null;}
    },
    async save(data){
      try{
        const s=JSON.stringify(data);
        if(ws){await ws.set(KEY,s);}else{localStorage.setItem(KEY,s);}
        return true;
      }catch(e){console.error(e);return false;}
    }
  };
})();

/* =========================================================
   2. Durum
   ========================================================= */
const DEF={
  settings:{shop:'Market',vat:20,footer:'Bizi tercih ettiğiniz için teşekkürler.',lowStock:5},
  products:[],sales:[],purchases:[],expenses:[],cash:[]
};
let S=clone(DEF);
let cart=[],payment='nakit',discount=0,view='pos';
let saveTimer=null;
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>Store.save(S),300);}
const byBarcode=b=>S.products.find(p=>p.barcode===String(b).trim());
const byId=id=>S.products.find(p=>p.id===id);

/* =========================================================
   3. EAN-13 / EAN-8 çözücü (kütüphanesiz, her tarayıcıda çalışır)
   ========================================================= */
const L_PAT=[[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],[1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
const G_PAT=L_PAT.map(p=>[...p].reverse());
const FIRST=[0x00,0x0B,0x0D,0x0E,0x13,0x19,0x1C,0x15,0x16,0x1A];

function matchPat(w,table){
  const tot=w[0]+w[1]+w[2]+w[3];
  if(tot<=0) return -1;
  const u=tot/7, c=w.map(x=>Math.round(x/u));
  if(c.reduce((a,b)=>a+b,0)!==7) return -1;
  for(let d=0;d<10;d++){
    const t=table[d];
    if(t[0]===c[0]&&t[1]===c[1]&&t[2]===c[2]&&t[3]===c[3]){
      // ince hata payı kontrolü
      let err=0;for(let i=0;i<4;i++)err+=Math.abs(w[i]/u-t[i]);
      if(err<1.4) return d;
    }
  }
  return -1;
}
function checkDigit(digits){ // sağdan 3,1,3,1...
  let s=0;
  for(let i=digits.length-1,w=3;i>=0;i--,w=(w===3?1:3)) s+=digits[i]*w;
  return (10-(s%10))%10;
}
function runsFromLine(lum,w){
  let min=255,max=0;
  for(let i=0;i<w;i++){const v=lum[i];if(v<min)min=v;if(v>max)max=v;}
  if(max-min<45) return null;
  const th=(min+max)/2;
  const runs=[];let dark=lum[0]<th,len=0;
  for(let i=0;i<w;i++){
    const d=lum[i]<th;
    if(d===dark)len++;else{runs.push({len,dark});dark=d;len=1;}
  }
  runs.push({len,dark});
  return runs;
}
function tryDecode(runs){
  const n=runs.length;
  for(const spec of [{total:59,left:6,right:6,type:13},{total:43,left:4,right:4,type:8}]){
    for(let s=0;s+spec.total<=n;s++){
      if(!runs[s].dark) continue;
      const g=[runs[s].len,runs[s+1].len,runs[s+2].len];
      const mod=(g[0]+g[1]+g[2])/3;
      if(mod<0.8) continue;
      if(g.some(x=>x<mod*0.55||x>mod*1.75)) continue;
      const span=runs.slice(s,s+spec.total).reduce((a,r)=>a+r.len,0);
      const expect=(spec.type===13?95:67)*mod;
      if(span<expect*0.72||span>expect*1.4) continue;
      // sol
      let i=s+3, digits=[], parity=0, ok=true;
      for(let k=0;k<spec.left;k++){
        const w=[runs[i].len,runs[i+1].len,runs[i+2].len,runs[i+3].len];
        let d=matchPat(w,L_PAT), bit=0;
        if(d<0&&spec.type===13){d=matchPat(w,G_PAT);bit=1;}
        if(d<0){ok=false;break;}
        digits.push(d); parity=(parity<<1)|bit; i+=4;
      }
      if(!ok) continue;
      i+=5; // orta guard
      for(let k=0;k<spec.right;k++){
        if(i+3>=n){ok=false;break;}
        const w=[runs[i].len,runs[i+1].len,runs[i+2].len,runs[i+3].len];
        const d=matchPat(w,L_PAT);
        if(d<0){ok=false;break;}
        digits.push(d); i+=4;
      }
      if(!ok) continue;
      if(spec.type===13){
        const f=FIRST.indexOf(parity);
        if(f<0) continue;
        digits.unshift(f);
      }
      const body=digits.slice(0,-1);
      if(checkDigit(body)!==digits[digits.length-1]) continue;
      return digits.join('');
    }
  }
  return null;
}
function decodeLine(lum,w){
  let r=runsFromLine(lum,w);
  if(!r) return null;
  let v=tryDecode(r);
  if(v) return v;
  return tryDecode(r.slice().reverse());
}

/* =========================================================
   4. Kamera / barkod okuma modalı
   ========================================================= */
const Scanner={
  stream:null,video:null,cvs:null,ctx:null,det:null,timer:null,cb:null,
  cand:null,hits:0,devices:[],devIdx:0,el:null,
  supportsNative(){return 'BarcodeDetector' in window;},
  async open(cb){
    this.cb=cb;this.cand=null;this.hits=0;
    const ovl=document.createElement('div');ovl.className='ovl';
    ovl.innerHTML=`<div class="modal" role="dialog" aria-label="Barkod okut">
      <div class="mhead"><h3>Barkod okut</h3><button class="x" data-close>✕</button></div>
      <div class="cam" id="camWrap">
        <video id="vid" playsinline muted autoplay></video>
        <div class="frame"><div class="laser"></div></div>
        <div class="camstate"><span id="camMsg">Kamera açılıyor…</span><span id="camMode" class="mono"></span></div>
      </div>
      <div class="mbody">
        <div class="row" style="margin-bottom:10px">
          <button class="btn ghost sm" id="swapCam">Kamerayı değiştir</button>
          <button class="btn ghost sm" id="torchBtn">Işık</button>
        </div>
        <label class="f"><span>Okumuyor mu? Barkodu elle yaz</span>
          <input id="manual" class="mono" inputmode="numeric" placeholder="8690000000000" autocomplete="off"></label>
        <button class="btn" style="width:100%" id="manualOk">Bu barkodu kullan</button>
        <p style="font-size:12px;color:var(--muted);margin:10px 0 0">Barkodu çerçeveye yatay ve net gelecek şekilde tutun. Ürün paketi parlıyorsa açıyı biraz değiştirin.</p>
      </div>
    </div>`;
    $('#modals').append(ovl);this.el=ovl;
    ovl.addEventListener('click',e=>{if(e.target===ovl||e.target.dataset.close!==undefined)this.close();});
    $('#manualOk',ovl).onclick=()=>{const v=$('#manual',ovl).value.trim();if(v){this.done(v);}};
    $('#manual',ovl).addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v)this.done(v);}});
    $('#swapCam',ovl).onclick=()=>this.swap();
    $('#torchBtn',ovl).onclick=()=>this.torch();
    this.video=$('#vid',ovl);
    this.cvs=document.createElement('canvas');this.ctx=this.cvs.getContext('2d',{willReadFrequently:true});
    if(this.supportsNative()){
      try{this.det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']});}catch(e){this.det=null;}
    }
    $('#camMode',ovl).textContent=this.det?'hızlı mod':'uyumluluk modu';
    await this.start();
  },
  async start(devId){
    try{
      const c=devId?{deviceId:{exact:devId}}:{facingMode:{ideal:'environment'}};
      c.width={ideal:1280};c.height={ideal:720};
      this.stream=await navigator.mediaDevices.getUserMedia({video:c,audio:false});
      this.video.srcObject=this.stream;
      await this.video.play().catch(()=>{});
      try{this.devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');}catch(e){}
      $('#camMsg',this.el).textContent='Barkodu çerçeveye getirin';
      this.loop();
    }catch(err){
      const w=$('#camWrap',this.el);
      const why=(err&&err.name==='NotAllowedError')?'Kamera izni verilmedi. Tarayıcı adres çubuğundaki kamera simgesinden izin verip tekrar deneyin.'
        :(err&&err.name==='NotFoundError')?'Bu cihazda kamera bulunamadı.'
        :'Kamera açılamadı. Sayfa https:// veya localhost üzerinden açılmalı.';
      w.innerHTML=`<div class="camerr">${esc(why)}<br><br>Aşağıdan barkodu elle girebilirsiniz.</div>`;
    }
  },
  async swap(){
    if(!this.devices.length){try{this.devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');}catch(e){}}
    if(this.devices.length<2){toast('Başka kamera bulunamadı');return;}
    this.devIdx=(this.devIdx+1)%this.devices.length;
    this.stopStream();
    await this.start(this.devices[this.devIdx].deviceId);
  },
  async torch(){
    try{
      const tr=this.stream&&this.stream.getVideoTracks()[0];
      if(!tr) return;
      const cap=tr.getCapabilities?tr.getCapabilities():{};
      if(!cap.torch){toast('Bu kamerada ışık yok');return;}
      this._t=!this._t;
      await tr.applyConstraints({advanced:[{torch:this._t}]});
    }catch(e){toast('Işık açılamadı');}
  },
  loop(){
    const step=async()=>{
      if(!this.stream) return;
      try{
        const v=this.video;
        if(v.readyState>=2&&v.videoWidth){
          let found=null;
          if(this.det){
            try{const r=await this.det.detect(v);if(r&&r.length)found=r[0].rawValue;}catch(e){this.det=null;}
          }
          if(!found) found=this.scanFrame();
          if(found) this.hit(found);
        }
      }catch(e){}
      this.timer=setTimeout(step,this.det?140:90);
    };
    step();
  },
  scanFrame(){
    const v=this.video,W=640;
    const H=Math.round(v.videoHeight/v.videoWidth*W)||480;
    if(this.cvs.width!==W){this.cvs.width=W;this.cvs.height=H;}
    this.ctx.drawImage(v,0,0,W,H);
    const lines=11,top=Math.round(H*0.22),bot=Math.round(H*0.78);
    for(let i=0;i<lines;i++){
      const y=Math.round(top+(bot-top)*(i/(lines-1)));
      const d=this.ctx.getImageData(0,y,W,1).data;
      const lum=new Uint8Array(W);
      for(let x=0;x<W;x++){const o=x*4;lum[x]=(d[o]*299+d[o+1]*587+d[o+2]*114)/1000;}
      const code=decodeLine(lum,W);
      if(code) return code;
    }
    return null;
  },
  hit(code){
    if(code===this.cand){this.hits++;}else{this.cand=code;this.hits=1;}
    const need=this.det?1:2;
    if(this.hits>=need){beep();vibrate();this.done(code);}
    else{$('#camMsg',this.el).textContent='Okunuyor: '+code;}
  },
  done(code){const cb=this.cb;this.close();cb&&cb(String(code).trim());},
  stopStream(){clearTimeout(this.timer);if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null;}},
  close(){this.stopStream();this._t=false;if(this.el){this.el.remove();this.el=null;}this.cb=null;}
};

function modal(title,bodyHTML,footHTML,wide){
  const ovl=document.createElement('div');ovl.className='ovl';
  ovl.innerHTML=`<div class="modal${wide?' wide':''}" role="dialog">
    <div class="mhead"><h3>${esc(title)}</h3><button class="x" data-close>✕</button></div>
    <div class="mbody">${bodyHTML}</div>
    ${footHTML?`<div class="mfoot">${footHTML}</div>`:''}
  </div>`;
  $('#modals').append(ovl);
  const close=()=>ovl.remove();
  ovl.addEventListener('click',e=>{if(e.target===ovl||e.target.dataset.close!==undefined)close();});
  return{el:ovl,close};
}

   ========================================================= */
function cartTotals(){
  let gross=0,vat=0,cost=0;
  cart.forEach(l=>{
    const line=l.price*l.qty;
    gross+=line;cost+=l.cost*l.qty;
    vat+=line-line/(1+l.vat/100);
  });
  const disc=gross*(discount/100);
  const net=gross-disc;
  const vatNet=vat*(1-discount/100);
  return{gross,disc,net,vat:vatNet,cost,profit:net-vatNet-cost};
}
function addToCart(p,qty){
  const ex=cart.find(l=>l.id===p.id);
  const add=qty??(p.unit==='kg'?null:1);
  if(p.unit==='kg'&&add===null){askWeight(p);return;}
  if(ex){ex.qty+=add;}else{cart.push({id:p.id,barcode:p.barcode,name:p.name,unit:p.unit,price:p.price,cost:p.cost,vat:p.vat,qty:add});}
  renderPOS();
}
function askWeight(p){
  const m=modal(p.name,`<label class="f"><span>Ağırlık (kg) — kilo fiyatı ${money(p.price)}</span>
    <input id="w" class="mono" type="number" step="0.001" min="0" inputmode="decimal" value="1.000"></label>
    <div class="lcd"><div class="lbl">Tutar</div><div class="big" id="wt">${money(p.price)}</div></div>`,
    `<button class="btn ghost" data-close>Vazgeç</button><button class="btn" id="ok">Sepete ekle</button>`);
  const w=$('#w',m.el);w.focus();w.select();
  const upd=()=>$('#wt',m.el).textContent=money(p.price*(parseFloat(w.value)||0));
  w.oninput=upd;
  const ok=()=>{const v=parseFloat(w.value)||0;if(v>0){m.close();addToCart(p,v);}};
  $('#ok',m.el).onclick=ok;
  w.onkeydown=e=>{if(e.key==='Enter')ok();};
}
function handleBarcode(code){
  if(!code)return;
  const p=byBarcode(code);
  if(p){
    if(p.stock<=0&&p.unit!=='kg') toast(p.name+' stokta görünmüyor',true);
    addToCart(p);
    if(view==='pos')toast(p.name+' eklendi');
    return;
  }
  productForm(null,code,()=>{const np=byBarcode(code);if(np&&view==='pos')addToCart(np);});
}

      <td style="width:1%"><div class="qty"><button data-dec="${i}">−</button><span>${l.unit==='kg'?l.qty.toFixed(3):l.qty}</span><button data-inc="${i}">+</button></div></td>

    </tr>`).join(''):`<tr><td colspan="4"><div class="empty"><b>Sepet boş</b>Barkodu okutun ya da ürün adıyla arayın.</div></td></tr>`;

        <div class="line"><span>İskonto %${discount}</span><span>-${money(t.disc)}</span></div>
        <div class="line"><span>Dahil KDV</span><span>${money(t.vat)}</span></div>
      </div>
      <div style="margin:14px 0 8px" class="eyebrow">Ödeme türü</div>
      <div class="paybtns">
        ${['nakit','kart','veresiye'].map(p=>`<button class="pay ${payment===p?'on':''}" data-pay="${p}">${p}</button>`).join('')}

      <div id="cashCalc" style="margin-top:12px"></div>
      <button class="btn" style="width:100%;margin-top:12px;justify-content:center;padding:14px" id="finish" ${cart.length?'':'disabled'}>Satışı tamamla</button>
      <button class="btn ghost sm" style="width:100%;margin-top:8px;justify-content:center" id="clear" ${cart.length?'':'disabled'}>Sepeti boşalt</button>
    </div>
  </div>`;

  const q=$('#q');
  q.focus();
  q.addEventListener('input',()=>{
    const v=q.value.trim().toLowerCase();
    const box=$('#results');
    if(v.length<2||/^\d{6,}$/.test(v)){box.innerHTML='';return;}
    const hit=S.products.filter(p=>p.name.toLowerCase().includes(v)).slice(0,6);
    box.innerHTML=hit.length?`<div class="card" style="margin-bottom:12px">${hit.map(p=>`<button class="btn ghost sm" style="width:100%;justify-content:space-between;border:0;border-bottom:1px solid #EDF0EA;border-radius:0;padding:10px 14px" data-pick="${p.id}"><span>${esc(p.name)} <span class="chip">${qtyFmt(p.stock,p.unit)}</span></span><b class="mono">${money(p.price)}</b></button>`).join('')}</div>`:'';
    $$('[data-pick]',box).forEach(b=>b.onclick=()=>{addToCart(byId(b.dataset.pick));});
  });
  q.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const v=q.value.trim();if(!v)return;
    q.value='';$('#results').innerHTML='';
    handleBarcode(v);
  });
  const open=()=>Scanner.open(handleBarcode);
  $('#scanBtn').onclick=open;$('#scanBtn2').onclick=open;
  $$('[data-inc]').forEach(b=>b.onclick=()=>{const l=cart[+b.dataset.inc];l.qty+=l.unit==='kg'?0.1:1;renderPOS();});
  $$('[data-dec]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dec,l=cart[i];l.qty-=l.unit==='kg'?0.1:1;if(l.qty<=0.001)cart.splice(i,1);renderPOS();});
  $$('[data-del]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.del,1);renderPOS();});
  $$('[data-pay]').forEach(b=>b.onclick=()=>{payment=b.dataset.pay;renderPOS();});
  $('#discBtn').onclick=()=>{
    const m=modal('İskonto',`<label class="f"><span>Fiş geneline iskonto (%)</span><input id="d" class="mono" type="number" min="0" max="90" value="${discount}"></label>`,`<button class="btn ghost" data-close>Vazgeç</button><button class="btn" id="ok">Uygula</button>`);
    $('#ok',m.el).onclick=()=>{discount=Math.min(90,Math.max(0,parseFloat($('#d',m.el).value)||0));m.close();renderPOS();};
  };
  $('#clear').onclick=()=>{cart=[];discount=0;renderPOS();};
  $('#finish').onclick=finishSale;
  if(payment==='nakit'&&cart.length){
    $('#cashCalc').innerHTML=`<label class="f"><span>Alınan nakit</span><input id="given" class="mono" type="number" inputmode="decimal" placeholder="${t.net.toFixed(2)}"></label><div id="change" style="font-family:var(--mono);font-size:15px"></div>`;
    $('#given').oninput=e=>{const g=parseFloat(e.target.value)||0;$('#change').innerHTML=g>=t.net?`Para üstü: <b>${money(g-t.net)}</b>`:`<span style="color:var(--red)">Eksik: ${money(t.net-g)}</span>`;};
  }
}
function todayStats(){
  const d=today();const s=S.sales.filter(x=>dayOf(x.ts)===d);
  return{count:s.length,total:s.reduce((a,x)=>a+x.net,0)};
}
function finishSale(){
  if(!cart.length)return;
  const t=cartTotals();
  let customer='';
  const go=()=>{
    const sale={id:uid(),ts:Date.now(),no:S.sales.length+1,items:cart.map(l=>({...l})),
      gross:t.gross,disc:t.disc,net:t.net,vat:t.vat,cost:t.cost,profit:t.profit,payment,discount,customer};
    cart.forEach(l=>{const p=byId(l.id);if(p)p.stock=+(p.stock-l.qty).toFixed(3);});
    S.sales.push(sale);
    if(payment==='nakit')S.cash.push({id:uid(),ts:sale.ts,type:'giris',amount:t.net,note:'Satış #'+sale.no,ref:sale.id});
    persist();
    const low=cart.map(l=>byId(l.id)).filter(p=>p&&p.unit!=='kg'&&p.stock<=(S.settings.lowStock||5));
    cart=[];discount=0;payment='nakit';
    renderPOS();
    toast('Satış kaydedildi · '+money(sale.net));
    if(low.length)toast('Kritik stok: '+low.map(p=>p.name).join(', '),true);
    receipt(sale);
  };
  if(payment==='veresiye'){
    const m=modal('Veresiye',`<label class="f"><span>Müşteri adı</span><input id="c" placeholder="Ör. Ahmet Bey"></label>`,`<button class="btn ghost" data-close>Vazgeç</button><button class="btn" id="ok">Kaydet</button>`);
    $('#c',m.el).focus();
    $('#ok',m.el).onclick=()=>{customer=$('#c',m.el).value.trim()||'İsimsiz';m.close();go();};
  }else go();
}

let period='ay';
function inPeriod(ts){
  const d=new Date(ts),n=new Date();
  if(period==='gun')return dayOf(ts)===today();
  if(period==='hafta')return (n-d)<7*864e5;
  if(period==='ay')return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
  return true;
}
function books(){
  const sales=S.sales.filter(s=>inPeriod(s.ts));
  const purch=S.purchases.filter(p=>inPeriod(p.ts));
  const exp=S.expenses.filter(e=>inPeriod(e.ts));
  const ciro=sales.reduce((a,s)=>a+s.net,0);
  const kdvSat=sales.reduce((a,s)=>a+s.vat,0);
  const smm=sales.reduce((a,s)=>a+s.cost,0);
  const kdvAl=purch.reduce((a,p)=>a+p.vat,0)+exp.reduce((a,e)=>a+e.vat,0);
  const gider=exp.reduce((a,e)=>a+e.amount,0);
  const brut=ciro-kdvSat-smm;
  const kasa=S.cash.reduce((a,c)=>a+(c.type==='giris'?c.amount:-c.amount),0);
  return{sales,purch,exp,ciro,kdvSat,kdvAl,smm,gider,brut,net:brut-gider,kdvOde:Math.max(0,kdvSat-kdvAl),kasa,
    alis:purch.reduce((a,p)=>a+p.total,0),veresiye:S.sales.filter(s=>s.payment==='veresiye').reduce((a,s)=>a+s.net,0)};
}

    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products)throw 0;S={...clone(DEF),...d};persist();toast('Yedek geri yüklendi');renderAyar();}catch(err){toast('Dosya okunamadı',true);}};
    r.readAsText(f);
  };
  $('#csv').onclick=()=>{
    const rows=[['barkod','ad','kategori','birim','alis','satis','kdv','stok'],
      ...S.products.map(p=>[p.barcode,p.name,p.category,p.unit,p.cost,p.price,p.vat,p.stock])];
    const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='stok-'+today()+'.csv';a.click();
  };
  $('#demo').onclick=()=>{loadDemo();persist();toast('Örnek ürünler eklendi');renderAyar();};
  $('#wipe').onclick=()=>{if(confirm('Tüm ürün, satış ve muhasebe kayıtları silinecek. Emin misiniz?')){S=clone(DEF);cart=[];buy=[];persist();toast('Veriler silindi');renderAyar();}};
}

    ['8690632075327','Tam Yağlı Süt 1 L','süt ürünleri','adet',24,32,1,26],
    ['8690526010113','Çay 1 kg','temel gıda','adet',180,235,10,12],

    ['8690624001234','Kola 1 L','içecek','adet',28,42,10,31],

}

/* =========================================================
   12. Yönlendirme
   ========================================================= */
const VIEWS={pos:renderPOS,stok:renderStok,alis:renderAlis,muhasebe:renderMuhasebe,rapor:renderRapor,ayar:renderAyar};
function go(v){view=v;$$('.navbtn').forEach(b=>b.classList.toggle('on',b.dataset.v===v));VIEWS[v]();window.scrollTo(0,0);}
$$('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.v));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const o=$$('.ovl').pop();if(o){Scanner.el===o?Scanner.close():o.remove();}}
  if(e.key==='F2'&&view==='pos'){e.preventDefault();Scanner.open(handleBarcode);}
});
// dekoratif barkod şeridi
$('#brandbars').innerHTML=[3,7,2,9,4,2,6,3,8,2,5].map(h=>`<i style="height:${h*2.4}px"></i>`).join('');

(async()=>{
  const saved=await Store.load();
  if(saved&&saved.products){S={...clone(DEF),...saved};S.settings={...DEF.settings,...(saved.settings||{})};}
  else{loadDemo();persist();}
  go('pos');
})();
</script>
