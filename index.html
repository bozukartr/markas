<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0E13" media="(prefers-color-scheme: dark)">
<meta name="description" content="Market kasa, stok, mal kabul ve muhasebe yönetimi — dokunmatik ekranlar için tasarlandı.">
<title>Kasa — Market Yönetimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Kasa · Tasarım sistemi
   Dokunmatik öncelikli, duyarlı, açık/koyu temalı
   ========================================================= */
:root{
  color-scheme:light;
  /* yüzeyler */
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F7F9FB; --surface-3:#EDF1F5;
  --line:#E3E8EE; --line-2:#D2DAE4;
  /* metin */
  --ink:#0D1420; --ink-2:#3A4459; --muted:#6D7890;
  /* marka */
  --brand:#0F7A56; --brand-2:#0B5F43; --brand-soft:#E2F2EB; --brand-ink:#0A5B3F; --on-brand:#FFFFFF;
  --accent:#FFC93E; --accent-2:#F0B720; --accent-soft:#FFF5D9; --on-accent:#3E2E00;
  --red:#C0392B; --red-soft:#FBEAE7; --red-ink:#8E241A;
  --green:#177A4E; --green-soft:#E3F3EB;
  --warn:#8A5D00; --warn-soft:#FFF2D2;
  --info:#1F5F9E; --info-soft:#E6F0FA;
  /* kenar çubuğu */
  --side:#0E1712; --side-2:#1A2620; --side-3:#243128; --side-ink:#C6D1CA; --side-ink-2:#8B978F; --side-line:#232F28;
  /* lcd */
  --lcd-bg:#08120C; --lcd:#7CFFA8; --lcd-2:#4F9E6C; --lcd-line:#173420;
  /* gölge */
  --sh-1:0 1px 2px rgba(13,20,32,.05);
  --sh-2:0 1px 3px rgba(13,20,32,.06), 0 10px 26px -14px rgba(13,20,32,.22);
  --sh-3:0 30px 70px -24px rgba(13,20,32,.42), 0 4px 12px rgba(13,20,32,.08);
  --ring:0 0 0 3px rgba(15,122,86,.24);
  /* biçim */
  --r-xs:8px; --r-sm:10px; --r:14px; --r-lg:18px; --r-xl:24px; --r-full:999px;
  --tap:48px; --tap-sm:44px;
  --tabbar:66px;
  --dur:.18s; --ease:cubic-bezier(.2,.7,.3,1);
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0E13; --surface:#131A22; --surface-2:#182028; --surface-3:#1F2831;
  --line:#242E39; --line-2:#303C49;
  --ink:#E8EEF5; --ink-2:#B2BECD; --muted:#8593A5;
  --brand:#2FB483; --brand-2:#3DC793; --brand-soft:#102A20; --brand-ink:#7FE3BA; --on-brand:#03170F;
  --accent:#FFC93E; --accent-2:#FFD873; --accent-soft:#2C2409; --on-accent:#2A1F00;
  --red:#E5695A; --red-soft:#301A18; --red-ink:#F09A8F;
  --green:#3DC793; --green-soft:#102A20;
  --warn:#E5B65A; --warn-soft:#2C2409;
  --info:#6FB0EE; --info-soft:#12212F;
  --side:#080C10; --side-2:#131B22; --side-3:#1C262F; --side-ink:#C0CBD8; --side-ink-2:#7C8A9A; --side-line:#1D262F;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 3px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.7);
  --sh-3:0 30px 70px -24px rgba(0,0,0,.8), 0 4px 12px rgba(0,0,0,.4);
  --ring:0 0 0 3px rgba(47,180,131,.32);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A0E13; --surface:#131A22; --surface-2:#182028; --surface-3:#1F2831;
    --line:#242E39; --line-2:#303C49;
    --ink:#E8EEF5; --ink-2:#B2BECD; --muted:#8593A5;
    --brand:#2FB483; --brand-2:#3DC793; --brand-soft:#102A20; --brand-ink:#7FE3BA; --on-brand:#03170F;
    --accent:#FFC93E; --accent-2:#FFD873; --accent-soft:#2C2409; --on-accent:#2A1F00;
    --red:#E5695A; --red-soft:#301A18; --red-ink:#F09A8F;
    --green:#3DC793; --green-soft:#102A20;
    --warn:#E5B65A; --warn-soft:#2C2409;
    --info:#6FB0EE; --info-soft:#12212F;
    --side:#080C10; --side-2:#131B22; --side-3:#1C262F; --side-ink:#C0CBD8; --side-ink-2:#7C8A9A; --side-line:#1D262F;
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 1px 3px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.7);
    --sh-3:0 30px 70px -24px rgba(0,0,0,.8), 0 4px 12px rgba(0,0,0,.4);
    --ring:0 0 0 3px rgba(47,180,131,.32);
  }
}

/* ---------- temel ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button,[role="button"],a,label,select,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:.01em;line-height:1.15}
p{margin:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
::selection{background:var(--brand);color:var(--on-brand)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted);font-weight:600}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar,.cart::-webkit-scrollbar,.modal::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-thumb,.cart::-webkit-scrollbar-thumb,.modal::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
/* masaüstü/mobil ayrımlı içerik */
.m-only{display:none}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* =========================================================
   Kabuk
   ========================================================= */
.app{display:flex;min-height:100dvh}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
main{flex:1;min-width:0;width:100%;max-width:1560px;margin:0 auto;padding:24px 28px 48px}

/* ---------- kenar çubuğu (masaüstü) ---------- */
.sidebar{
  width:248px;flex:0 0 248px;background:var(--side);color:var(--side-ink);
  display:flex;flex-direction:column;gap:2px;padding:18px 12px;
  position:sticky;top:0;height:100dvh;z-index:30;
}
.sidebar .brand{padding:8px 12px 20px;display:flex;align-items:center;gap:12px}
.bars{display:flex;gap:2px;align-items:flex-end;height:26px;flex:0 0 auto}
.bars i{display:block;width:2px;background:var(--accent);border-radius:1px}
.brand .txt{min-width:0}
.brand b{font-family:var(--disp);font-size:21px;letter-spacing:.18em;text-transform:uppercase;color:#fff;display:block;line-height:1}
.brand small{display:block;font-size:11.5px;color:var(--side-ink-2);letter-spacing:.02em;margin-top:3px;white-space:nowrap}
.navlist{display:flex;flex-direction:column;gap:2px}
.navbtn{
  position:relative;color:var(--side-ink-2);min-height:var(--tap);padding:0 14px;border-radius:var(--r-sm);
  display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:500;letter-spacing:.01em;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);width:100%;text-align:left;
}
.navbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.navbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn:hover{color:#fff;background:var(--side-2)}
.navbtn.on{color:#fff;background:var(--side-3);font-weight:600}
.navbtn.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--accent)}
.navbtn:active{transform:scale(.985)}
.sidebar .spacer{flex:1;min-height:12px}
.sidefoot{border-top:1px solid var(--side-line);padding-top:10px;margin-top:6px;display:flex;flex-direction:column;gap:2px}

/* ---------- üst çubuk (mobil) ---------- */
.topbar{
  display:none;position:sticky;top:0;z-index:35;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);align-items:center;gap:10px;
}
.topbar .tbrand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.topbar .tbrand b{font-family:var(--disp);font-size:19px;letter-spacing:.18em;text-transform:uppercase;line-height:1}
.topbar .bars i{background:var(--brand)}
.tbacts{display:flex;gap:6px;flex:0 0 auto}
.tbacts .iconbtn span{display:none}
.iconbtn{
  width:var(--tap);height:var(--tap);border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-2);border:1px solid transparent;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.iconbtn:active{background:var(--line)}
.iconbtn.on{background:var(--brand-soft);color:var(--brand-ink)}
.sidefoot .iconbtn{width:100%;justify-content:flex-start;gap:12px;padding:0 14px;min-height:var(--tap);height:auto;color:var(--side-ink-2);font-size:14.5px}
.sidefoot .iconbtn:hover{background:var(--side-2);color:#fff}

/* =========================================================
   Sayfa başlığı
   ========================================================= */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.head h1{font-size:32px;margin-top:2px}
.head .sub{font-size:13.5px;color:var(--muted);margin-top:5px}
.head .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* =========================================================
   Bileşenler
   ========================================================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.card.raise{box-shadow:var(--sh-2)}
.pad{padding:18px}
.sect-title{font-family:var(--disp);font-size:21px;margin:26px 0 12px;letter-spacing:.01em}

/* butonlar */
.btn{
  --btn-bg:var(--brand); --btn-fg:var(--on-brand); --btn-bd:var(--brand);
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:var(--tap);padding:0 20px;border-radius:var(--r-sm);
  background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-bd);
  font-weight:600;font-size:14.5px;letter-spacing:.005em;white-space:nowrap;
  box-shadow:var(--sh-1);transition:filter var(--dur) var(--ease),transform var(--dur) var(--ease),background var(--dur) var(--ease),border-color var(--dur) var(--ease);
  user-select:none;
}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px) scale(.99);filter:brightness(.95)}
.btn.ghost{--btn-bg:var(--surface);--btn-fg:var(--ink);--btn-bd:var(--line-2)}
.btn.ghost:hover{--btn-bg:var(--surface-2);--btn-bd:var(--muted);filter:none}
.btn.soft{--btn-bg:var(--surface-3);--btn-fg:var(--ink);--btn-bd:transparent;box-shadow:none}
.btn.soft:hover{--btn-bg:var(--line);filter:none}
.btn.tag{--btn-bg:var(--accent);--btn-fg:var(--on-accent);--btn-bd:var(--accent-2)}
.btn.dark{--btn-bg:var(--ink);--btn-fg:var(--surface);--btn-bd:var(--ink)}
.btn.danger{--btn-bg:transparent;--btn-fg:var(--red);--btn-bd:color-mix(in srgb,var(--red) 34%,transparent);box-shadow:none}
.btn.danger:hover{--btn-bg:var(--red-soft);filter:none}
.btn.sm{min-height:var(--tap-sm);padding:0 14px;font-size:13.5px;border-radius:var(--r-xs)}
.btn.lg{min-height:58px;font-size:16px;padding:0 26px;border-radius:var(--r)}
.btn.wide{width:100%}
.btn.icon{padding:0;width:var(--tap);flex:0 0 auto}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none;filter:none}

/* form */
input,select,textarea{
  width:100%;min-height:var(--tap);padding:11px 14px;font-size:16px;
  border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);appearance:none;
}
textarea{min-height:82px;line-height:1.5;resize:vertical}
select{
  padding-right:42px;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236D7890' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;background-size:19px;
}
:root[data-theme="dark"] select{background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238593A5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E")}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:var(--ring)}
input[type="number"]{-moz-appearance:textfield}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
label.f .hint{font-size:12px;color:var(--muted);margin-top:6px;font-weight:400}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 160px;min-width:0}

/* segmentli seçim */
.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--r-sm);padding:4px;gap:4px;flex-wrap:wrap}
.seg button{
  min-height:var(--tap-sm);padding:0 16px;border-radius:var(--r-xs);font-size:14px;font-weight:600;color:var(--ink-2);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);white-space:nowrap;
}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.seg button:active{transform:scale(.97)}

/* tablo */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{
  text-align:left;font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted);
  font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);
  position:sticky;top:0;z-index:1;
}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background var(--dur) var(--ease)}
@media (hover:hover){tbody tr:hover{background:var(--surface-2)}}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.shrink{width:1%;white-space:nowrap}
.tsub{font-size:12px;color:var(--muted);margin-top:3px}

/* rozet */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-full);
  font-size:12px;font-weight:600;background:var(--surface-3);color:var(--ink-2);white-space:nowrap;line-height:1.4;
}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--red-soft);color:var(--red-ink)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}

/* boş durum */
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;font-family:var(--disp);font-size:21px;color:var(--ink);margin-bottom:6px;letter-spacing:.01em;font-weight:600}
.empty .ico{width:52px;height:52px;border-radius:var(--r);background:var(--surface-3);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:24px}

/* =========================================================
   Izgaralar
   ========================================================= */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 396px;gap:18px;align-items:start}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;align-items:start}
.side-sticky{position:sticky;top:24px}

/* =========================================================
   Satış ekranı
   ========================================================= */
.scanbar{display:flex;gap:10px;align-items:center;padding:12px;margin-bottom:14px}
.fieldwrap{position:relative;flex:1 1 auto;min-width:0}
.fieldwrap>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.fieldwrap input{padding-left:44px}
.scanbar input{font-family:var(--mono);font-size:16px;letter-spacing:.03em;padding-left:44px;height:var(--tap)}
.results{margin-bottom:14px;overflow:hidden}
.pick{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  min-height:56px;padding:10px 16px;border-bottom:1px solid var(--line);text-align:left;
  transition:background var(--dur) var(--ease);
}
.pick:last-child{border-bottom:0}
.pick:hover,.pick:active{background:var(--brand-soft)}
.pick .nm{font-weight:600;font-size:14.5px}
.cart{max-height:calc(100dvh - 300px);overflow:auto}
.cart td{padding:12px 14px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface);flex:0 0 auto}
.qty>*{flex:0 0 auto}
.qty button{
  width:var(--tap-sm);height:var(--tap-sm);display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);font-size:20px;line-height:1;color:var(--ink);font-weight:500;
  transition:background var(--dur) var(--ease);
}
.qty button:hover{background:var(--brand-soft);color:var(--brand-ink)}
.qty button:active{background:var(--brand);color:var(--on-brand)}
.qty span{min-width:62px;text-align:center;font-family:var(--mono);font-size:14.5px;font-weight:600;padding:0 4px}
.qty .qin{
  width:78px;min-height:var(--tap-sm);border:0;border-radius:0;text-align:center;background:transparent;
  font-family:var(--mono);font-size:14.5px;font-weight:600;padding:0 2px;
}
.qty .qin:focus{box-shadow:none;background:var(--brand-soft)}
.qty:focus-within{border-color:var(--brand);box-shadow:var(--ring)}

/* LCD gösterge */
.lcd{
  background:var(--lcd-bg);border-radius:var(--r);padding:18px 20px;color:var(--lcd);position:relative;overflow:hidden;
  border:1px solid var(--lcd-line);
}
.lcd::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px);pointer-events:none}
.lcd .lbl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.2em;font-size:11px;color:var(--lcd-2);font-weight:600}
.lcd .big{font-family:var(--mono);font-weight:700;font-size:clamp(30px,6vw,42px);line-height:1.12;letter-spacing:-.02em;text-shadow:0 0 18px rgba(124,255,168,.32);margin-top:2px}
.lcd .line{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:12.5px;color:var(--lcd-2);margin-top:4px}
.lcd .line b{color:var(--lcd);font-weight:700}
.lcd hr{border:0;border-top:1px dashed var(--lcd-line);margin:10px 0 6px}

/* ödeme türleri */
.paybtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pay{
  border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);
  min-height:56px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:14px;font-weight:600;color:var(--ink-2);
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease);
}
.pay svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pay:hover{border-color:var(--brand);color:var(--brand-ink)}
.pay:active{transform:scale(.98)}
.pay.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand);box-shadow:var(--sh-1)}

/* mobil ödeme rıhtımı */
.dock{display:none}

/* =========================================================
   İstatistik kartları + grafik
   ========================================================= */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh-1)}
.stat .k{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--mono);font-size:clamp(20px,2.4vw,25px);font-weight:700;margin-top:7px;letter-spacing:-.02em;line-height:1.15}
.stat .n{font-size:12.5px;color:var(--muted);margin-top:4px}
.stat.hl{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.stat.hl .k,.stat.hl .n{color:color-mix(in srgb,var(--surface) 62%,transparent)}
.stat.hero{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.stat.hero .k,.stat.hero .n{color:color-mix(in srgb,var(--on-brand) 72%,transparent)}
.bars7{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px;border-bottom:1px solid var(--line)}
.bars7 .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%;min-width:0}
.bars7 .b i{
  display:block;width:100%;max-width:56px;background:linear-gradient(180deg,var(--brand-2),var(--brand));
  border-radius:6px 6px 3px 3px;min-height:4px;transition:filter var(--dur) var(--ease);
}
.bars7 .b:hover i{filter:brightness(1.15)}
.bars7 .b em{font-style:normal;font-size:11.5px;color:var(--muted);font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.bars7 .b s{text-decoration:none;font-size:11px;color:var(--muted);font-family:var(--mono)}

/* =========================================================
   Modal / alt sayfa
   ========================================================= */
.ovl{
  position:fixed;inset:0;background:rgba(8,13,10,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;
  animation:fade .18s var(--ease);
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.modal{
  background:var(--surface);border-radius:var(--r-xl);width:100%;max-width:480px;max-height:92dvh;
  display:flex;flex-direction:column;box-shadow:var(--sh-3);border:1px solid var(--line);
  animation:rise .22s var(--ease);overflow:hidden;
}
.modal.wide{max-width:680px}
.grabber{display:none}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.mhead h3{font-size:21px}
.x{
  width:var(--tap-sm);height:var(--tap-sm);flex:0 0 auto;border-radius:var(--r-full);background:var(--surface-3);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;transition:background var(--dur) var(--ease);
}
.x svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.x:hover{background:var(--line);color:var(--ink)}
.x:active{background:var(--line-2)}
.mbody{padding:18px;overflow:auto;overscroll-behavior:contain;flex:1 1 auto}
.mfoot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex:0 0 auto;background:var(--surface-2);flex-wrap:wrap}
.mfoot .btn{flex:1 1 auto;max-width:none}

/* =========================================================
   Barkod kamerası
   ========================================================= */
.cam{position:relative;background:#000;aspect-ratio:4/3;overflow:hidden}
.cam.camoff{aspect-ratio:auto;max-height:none}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;left:6%;right:6%;top:19%;height:62%;border:2px solid rgba(255,201,62,.95);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.4)}
.frame::before,.frame::after{content:"";position:absolute;width:26px;height:26px;border:3px solid var(--accent);border-radius:6px}
.frame::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
.frame::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
.laser{position:absolute;left:6px;right:6px;top:50%;height:2px;background:#FF6250;box-shadow:0 0 14px #FF6250;border-radius:2px;animation:sweep 1.9s ease-in-out infinite}
@keyframes sweep{0%,100%{top:8%}50%{top:92%}}
.camstate{
  position:absolute;left:0;right:0;bottom:0;padding:12px 14px;
  background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;font-size:13px;
  display:flex;justify-content:space-between;gap:10px;align-items:center;
}
.camstate .mono{opacity:.75;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
.camerr{padding:28px 20px;text-align:center;color:#fff;background:#111815;font-size:14px;line-height:1.6}

/* =========================================================
   Bildirim + fiş
   ========================================================= */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 24px);
  z-index:80;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;
  width:min(94vw,440px);
}
.toast{
  background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:var(--r-full);font-size:14px;font-weight:500;
  box-shadow:var(--sh-3);animation:rise .22s var(--ease);max-width:100%;text-align:center;
}
:root[data-theme="dark"] .toast{background:var(--surface-3);color:var(--ink);border:1px solid var(--line-2)}
.toast.bad{background:var(--red);color:#fff}
.toast.good{background:var(--brand);color:var(--on-brand)}
#printArea{display:none}

/* =========================================================
   Duyarlılık
   ========================================================= */

/* orta: ikon rayı */
@media (max-width:1240px) and (min-width:901px){

  .navbtn.on::before{left:50%;top:auto;bottom:4px;transform:translateX(-50%);width:18px;height:3px;border-radius:3px}
  .sidefoot .iconbtn{flex-direction:column;gap:5px;padding:8px 2px;font-size:11.5px;justify-content:center;min-height:62px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em}
  main{padding:20px 20px 44px}
}

@media (max-width:1100px){
  .pos{grid-template-columns:minmax(0,1fr) 340px}
}

/* mobil + tablet dikey */
@media (max-width:900px){

  main:has(.dock){padding-bottom:calc(env(safe-area-inset-bottom) + var(--tabbar) + 110px)}

  /* alt sekme çubuğu */
  .sidebar{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;flex:none;height:auto;z-index:40;

  }
  .sidebar .brand,.sidebar .spacer,.sidebar .sidefoot,.nav-settings{display:none}
  .navlist{flex-direction:row;flex:1;gap:2px}
  .navbtn{
    flex:1;flex-direction:column;gap:4px;padding:7px 2px;min-height:54px;justify-content:center;
    font-size:10.5px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-weight:600;text-align:center;
  }
  .navbtn svg{width:22px;height:22px}
  .navbtn svg,.navbtn span{position:relative;z-index:1}
  .navbtn.on{background:transparent;color:var(--accent)}

    left:50%;top:4px;bottom:auto;transform:translateX(-50%);

  .pos,.split{grid-template-columns:minmax(0,1fr)}

  .cart{max-height:none}
  .stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

  /* mobil ödeme rıhtımı */

  }
  .dock .amt{flex:1;min-width:0}

  .dock .amt .v{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
  .dock .btn{flex:0 0 auto;min-width:158px}

  /* modaller alt sayfa olur */
  .ovl{align-items:flex-end;padding:0}
  .modal,.modal.wide{
    max-width:none;border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:92dvh;border-width:1px 0 0;
    animation:sheet .26s var(--ease);
  }
  .grabber{display:block;width:42px;height:5px;border-radius:99px;background:var(--line-2);margin:10px auto 0;flex:0 0 auto}
  .mhead{padding:12px 18px 14px}

  .mfoot .btn{flex:1 1 0;min-width:120px}

  .rt td.num{justify-content:space-between;text-align:right}
  .rt td.rt-title{display:block;padding:0 0 8px;font-size:15.5px}
  .rt td.rt-title::before{content:none}
  .rt td.rt-act{padding-top:12px}

  .cart-tbl .c-del{grid-column:2;grid-row:2;text-align:right}
  .cart-tbl .c-del .btn{width:var(--tap);padding:0}
  .cart-tbl .rt-full{grid-column:1/-1}
}

@media (max-width:420px){
  main{padding-left:12px;padding-right:12px}
  .head h1{font-size:23px}
  .pad{padding:15px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dock .btn{min-width:0;flex:1 1 auto}
  .dock .amt .v{font-size:19px}
  .paybtns{gap:8px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .laser{animation:none;top:50%}
}

@media print{

  .app,#toast,.ovl,.dock,.topbar{display:none !important}

  #printArea td,#printArea th{padding:2px 0;border:0;background:none}
}

<script>
/* =========================================================
   0. Yardımcılar
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const TL=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>TL.format(Number(n)||0)+' ₺';
const qtyFmt=(n,u)=>u==='kg'?(Number(n).toFixed(3)+' kg'):(Math.round(n)+' ad');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>(typeof structuredClone==='function'?structuredClone(o):JSON.parse(JSON.stringify(o)));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const dayOf=ts=>new Date(ts).toISOString().slice(0,10);
const dt=ts=>new Date(ts).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
function toast(msg,kind){
  const box=$('#toast');
  const cls='toast'+(kind===true||kind==='bad'?' bad':kind==='good'?' good':'');
  const last=box.lastElementChild;
  // aynı mesaj peş peşe gelirse yeni balon açma, sayacı artır (hızlı barkod okutmada yığılmasın)
  if(last&&last.dataset.msg===msg&&last.className===cls){
    const n=(+last.dataset.n||1)+1;
    last.dataset.n=n;last.textContent=msg+' ×'+n;
    clearTimeout(+last.dataset.timer);
    last.dataset.timer=setTimeout(()=>fade(last),2400);
    return;
  }
  const t=document.createElement('div');
  t.className=cls;t.dataset.msg=msg;t.dataset.n=1;
  t.setAttribute('role','status');t.textContent=msg;
  box.append(t);
  // yığılmayı önle: en fazla 2 balon dursun (hızlı barkod okutmada ekranı kapatmasın)
  while(box.children.length>2){
    const old=box.firstElementChild;
    clearTimeout(+old.dataset.timer);
    old.remove();
  }
  t.dataset.timer=setTimeout(()=>fade(t),2400);
  function fade(el){
    if(!el||!el.isConnected)return;
    clearTimeout(+el.dataset.timer);
    el.style.opacity='0';el.style.transition='opacity .3s';
    setTimeout(()=>el.remove(),320);
  }
}

/* =========================================================
   3. EAN-13 / EAN-8 çözücü (kütüphanesiz, her tarayıcıda çalışır)
   ========================================================= */
const L_PAT=[[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],[1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
const G_PAT=L_PAT.map(p=>[...p].reverse());
const FIRST=[0x00,0x0B,0x0D,0x0E,0x13,0x19,0x1C,0x15,0x16,0x1A];
const MAX_AVG_VAR=0.44, MAX_ONE_VAR=0.7;

/* Desen benzerliği: genişlikleri tam sayıya yuvarlamak yerine oransal sapmaya bakılır.
   Bulanık ve düşük çözünürlüklü kareler bu sayede okunabilir. */
function patVar(c,p,len){
  let tot=0,pl=0;
  for(let i=0;i<len;i++){tot+=c[i];pl+=p[i];}
  if(tot<pl) return Infinity;
  const unit=tot/pl, maxv=unit*MAX_ONE_VAR;
  let sum=0;
  for(let i=0;i<len;i++){
    const exp=p[i]*unit, d=c[i]>exp?c[i]-exp:exp-c[i];
    if(d>maxv) return Infinity;
    sum+=d;
  }
  return sum/tot;
}
function digitR(w){ // sağ taraf + EAN-8 sol tarafı (R ve L genişlikleri aynıdır)
  let best=-1,bv=MAX_AVG_VAR;
  for(let d=0;d<10;d++){const v=patVar(w,L_PAT[d],4);if(v<bv){bv=v;best=d;}}
  return best;
}
function digitLG(w){ // EAN-13 sol tarafı: L mi G mi kodlanmış
  let best=-1,bv=MAX_AVG_VAR,g=0;
  for(let d=0;d<10;d++){
    let v=patVar(w,L_PAT[d],4); if(v<bv){bv=v;best=d;g=0;}
    v=patVar(w,G_PAT[d],4);     if(v<bv){bv=v;best=d;g=1;}
  }
  return best<0?null:{d:best,g};
}
function checkDigit(digits){ // sağdan 3,1,3,1...
  let s=0;
  for(let i=digits.length-1,w=3;i>=0;i--,w=(w===3?1:3)) s+=digits[i]*w;
  return (10-(s%10))%10;
}

/* Blok tabanlı yerel eşikleme.
   Tek bir genel eşik, gölge veya eşit olmayan aydınlatmada barkodun yarısını
   yutuyordu; burada eşik her blokta komşularıyla birlikte yeniden hesaplanır. */
function runsOf(lum,w){
  const B=Math.max(6,Math.round(w/40)), nb=Math.ceil(w/B);
  const mn=new Uint8Array(nb).fill(255), mx=new Uint8Array(nb);
  for(let i=0;i<w;i++){const b=(i/B)|0,v=lum[i];if(v<mn[b])mn[b]=v;if(v>mx[b])mx[b]=v;}
  const th=new Int16Array(nb);
  let any=false;
  for(let b=0;b<nb;b++){
    let lo=255,hi=0;
    for(let k=b>0?b-1:0,e=b+1<nb?b+1:nb-1;k<=e;k++){if(mn[k]<lo)lo=mn[k];if(mx[k]>hi)hi=mx[k];}
    if(hi-lo>=18){th[b]=(lo+hi)>>1;any=true;}else{th[b]=-1;}
  }
  if(!any) return null; // düz yüzey, barkod yok
  const runs=[];
  let dark=th[0]>=0&&lum[0]<th[0], len=1;
  for(let i=1;i<w;i++){
    const t=th[(i/B)|0];
    const d=t>=0&&lum[i]<t;
    if(d===dark)len++;else{runs.push({len,dark});dark=d;len=1;}
  }
  runs.push({len,dark});
  return runs;
}

function tryDecode(runs){
  const n=runs.length;
  for(const sp of [{tot:59,half:6,type:13,mods:95},{tot:43,half:4,type:8,mods:67}]){
    for(let s=0;s+sp.tot<=n;s++){
      if(!runs[s].dark) continue;
      const g=[runs[s].len,runs[s+1].len,runs[s+2].len];
      if(patVar(g,[1,1,1],3)>MAX_AVG_VAR) continue;      // başlangıç kılavuzu 101
      const mod=(g[0]+g[1]+g[2])/3;
      if(mod<0.6) continue;
      let span=0; for(let k=s;k<s+sp.tot;k++) span+=runs[k].len;
      if(span<sp.mods*mod*0.62||span>sp.mods*mod*1.6) continue;
      const mid=s+3+sp.half*4;                            // orta kılavuz 01010
      if(patVar([runs[mid].len,runs[mid+1].len,runs[mid+2].len,runs[mid+3].len,runs[mid+4].len],[1,1,1,1,1],5)>MAX_AVG_VAR) continue;
      const e=s+sp.tot-3;                                 // bitiş kılavuzu 101
      if(patVar([runs[e].len,runs[e+1].len,runs[e+2].len],[1,1,1],3)>MAX_AVG_VAR) continue;
      // Sessiz bölge: EAN standardı kodun iki yanının boş olmasını şart koşar.
      // Rastgele çizgili desenlerin barkod sanılmasını engelleyen asıl kontrol budur.
      const qz=mod*2.5;
      if(s>0 && (runs[s-1].dark || runs[s-1].len<qz)) continue;
      if(s+sp.tot<n && (runs[s+sp.tot].dark || runs[s+sp.tot].len<qz)) continue;

      let i=s+3, digits=[], parity=0, ok=true;
      for(let k=0;k<sp.half;k++){
        const w=[runs[i].len,runs[i+1].len,runs[i+2].len,runs[i+3].len];
        if(sp.type===13){
          const r=digitLG(w);
          if(!r){ok=false;break;}
          digits.push(r.d); parity=(parity<<1)|r.g;
        }else{
          const d=digitR(w);
          if(d<0){ok=false;break;}
          digits.push(d);
        }
        i+=4;
      }
      if(!ok) continue;
      i+=5; // orta kılavuzu atla
      for(let k=0;k<sp.half;k++){
        const w=[runs[i].len,runs[i+1].len,runs[i+2].len,runs[i+3].len];
        const d=digitR(w);
        if(d<0){ok=false;break;}
        digits.push(d); i+=4;
      }
      if(!ok) continue;
      if(sp.type===13){
        const f=FIRST.indexOf(parity); // eşlik deseni ilk haneyi verir
        if(f<0) continue;
        digits.unshift(f);
      }
      if(checkDigit(digits.slice(0,-1))!==digits[digits.length-1]) continue;
      return digits.join('');
    }
  }
  return null;
}
function decodeLine(lum,w){
  const r=runsOf(lum,w);
  if(!r) return null;
  return tryDecode(r)||tryDecode(r.slice().reverse()); // baş aşağı tutulmuş barkod
}

const Scanner={

    $('#swapCam',ovl).onclick=()=>this.swap();
    $('#torchBtn',ovl).onclick=()=>this.torch();
    this.video=$('#vid',ovl);
    this.cvs=document.createElement('canvas');this.ctx=this.cvs.getContext('2d',{willReadFrequently:true});
    this.det=null;
    if(this.supportsNative()){
      try{
        const sup=await BarcodeDetector.getSupportedFormats();
        const want=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'].filter(f=>sup.includes(f));
        if(want.length) this.det=new BarcodeDetector({formats:want});
      }catch(e){this.det=null;}
    }
    $('#camMode',ovl).textContent=this.det?'hızlı mod':'uyumluluk modu';

  },
  async start(devId){
    try{
      const c=devId?{deviceId:{exact:devId}}:{facingMode:{ideal:'environment'}};
      // Barkod ince çubuklardan oluşur: çözünürlük ne kadar yüksekse okuma o kadar iyi.
      c.width={ideal:1920};c.height={ideal:1080};c.frameRate={ideal:30};
      c.advanced=[{focusMode:'continuous'}];
      this.stream=await navigator.mediaDevices.getUserMedia({video:c,audio:false});
      this.video.srcObject=this.stream;
      await this.video.play().catch(()=>{});
      try{ // destekleyen cihazlarda sürekli otomatik odak
        const tr=this.stream.getVideoTracks()[0];
        const cap=tr.getCapabilities?tr.getCapabilities():{};
        if(cap.focusMode&&cap.focusMode.includes('continuous')) await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});
      }catch(e){}
      try{this.devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');}catch(e){}
      $('#camMsg',this.el).textContent='Barkodu çerçeveye getirin';
      this.loop();
    }catch(err){
      const w=$('#camWrap',this.el);
      const why=(err&&err.name==='NotAllowedError')?'Kamera izni verilmedi. Tarayıcı adres çubuğundaki kamera simgesinden izin verip tekrar deneyin.'
        :(err&&err.name==='NotFoundError')?'Bu cihazda kamera bulunamadı.'
        :'Kamera açılamadı. Sayfa https:// veya localhost üzerinden açılmalı.';
      w.classList.add('camoff');
      w.innerHTML=`<div class="camerr">${esc(why)}<br><br>Aşağıdan barkodu elle girebilirsiniz.</div>`;
      softFocus($('#manual',this.el),true);
    }
  },
  async swap(){
    if(!this.devices.length){try{this.devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');}catch(e){}}
    if(this.devices.length<2){toast('Başka kamera bulunamadı');return;}
    this.devIdx=(this.devIdx+1)%this.devices.length;
    this.stopStream();
    await this.start(this.devices[this.devIdx].deviceId);
  },
  async torch(){
    try{
      const tr=this.stream&&this.stream.getVideoTracks()[0];
      if(!tr) return;
      const cap=tr.getCapabilities?tr.getCapabilities():{};
      if(!cap.torch){toast('Bu kamerada ışık yok');return;}
      this._t=!this._t;
      await tr.applyConstraints({advanced:[{torch:this._t}]});
    }catch(e){toast('Işık açılamadı');}
  },
  loop(){
    const step=async()=>{
      if(!this.stream) return;
      const t0=(typeof performance!=='undefined'?performance.now():Date.now());
      try{
        const v=this.video;
        if(v.readyState>=2&&v.videoWidth){
          let done=false;
          if(this.det){
            try{
              const r=await this.det.detect(v);
              if(r&&r.length){this.hit(r[0].rawValue,1,true);done=true;}
            }catch(e){this.det=null;}
          }
          if(!done){
            const r=this.scanFrame();
            if(r) this.hit(r.code,r.votes,false);
          }
        }
      }catch(e){}
      // işlem süresi kadar bekle: hızlı cihazda sık, yavaş cihazda seyrek tara
      const dt=(typeof performance!=='undefined'?performance.now():Date.now())-t0;
      this.timer=setTimeout(step,Math.max(60,Math.min(220,dt)));
    };
    step();
  },
  /* Kareyi tarar. Önceki sürüm kareyi 640 piksele küçültüp yalnızca 11 yatay
     satır okuyordu; ince çubuklar bu küçültmede kaybolduğu ve telefon 90°
     çevrildiğinde hiçbir yatay satır barkodu kesmediği için okuma tutmuyordu.
     Artık daha yüksek çözünürlükte, hem yatay hem dikey taranıyor. */
  scanFrame(){
    const v=this.video, vw=v.videoWidth, vh=v.videoHeight;
    if(!vw||!vh) return null;
    // ilgi alanı: karenin ortası (kılavuz çerçeveden biraz cömert)
    const rx=Math.round(vw*0.02), ry=Math.round(vh*0.06);
    const rw=vw-rx*2, rh=vh-ry*2;
    const CW=Math.min(800,rw), CH=Math.max(120,Math.round(rh*CW/rw));
    if(this.cvs.width!==CW||this.cvs.height!==CH){this.cvs.width=CW;this.cvs.height=CH;}
    this.ctx.drawImage(v,rx,ry,rw,rh,0,0,CW,CH);
    const d=this.ctx.getImageData(0,0,CW,CH).data;
    if(!this.gray||this.gray.length!==CW*CH) this.gray=new Uint8Array(CW*CH);
    const g=this.gray;
    for(let i=0,p=0;i<g.length;i++,p+=4) g[i]=(d[p]*299+d[p+1]*587+d[p+2]*114)/1000;

    const votes=Object.create(null);
    let best=null,bv=0;
    const cast=code=>{
      if(!code) return;
      const n=(votes[code]||0)+1; votes[code]=n;
      if(n>bv){bv=n;best=code;}
    };
    // yatay taramalar
    const ROWS=15;
    for(let i=0;i<ROWS;i++){
      const y=Math.min(CH-1,Math.round(CH*(i+0.5)/ROWS));
      cast(decodeLine(g.subarray(y*CW,y*CW+CW),CW));
    }
    // dikey taramalar — telefon yan çevrildiğinde barkod dikey durur
    if(!this.col||this.col.length!==CH) this.col=new Uint8Array(CH);
    const col=this.col, COLS=11;
    for(let i=0;i<COLS;i++){
      const x=Math.min(CW-1,Math.round(CW*(i+0.5)/COLS));
      for(let y=0;y<CH;y++) col[y]=g[y*CW+x];
      cast(decodeLine(col,CH));
    }
    return best?{code:best,votes:bv}:null;
  },
  /* Aynı karede iki bağımsız tarama satırı aynı kodu verirse doğrulanmış sayılır;
     tek satırdan gelen okuma bir sonraki kareyle teyit edilir. */
  hit(code,votes,trusted){
    if(code===this.cand) this.hits+=votes; else {this.cand=code;this.hits=votes;}
    if(trusted||this.hits>=2){beep();vibrate();this.done(code);}
    else if(this.el) $('#camMsg',this.el).textContent='Okunuyor: '+code;
  },
  done(code){const cb=this.cb;this.close();cb&&cb(String(code).trim());},
  stopStream(){clearTimeout(this.timer);if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null;}},
  close(){this.stopStream();this._t=false;if(this.el){this.el.remove();this.el=null;}this.cb=null;}
};

function modal(title,bodyHTML,footHTML,wide){
  const ovl=document.createElement('div');ovl.className='ovl';
  ovl.innerHTML=`<div class="modal${wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="grabber"></div>
    <div class="mhead"><h3>${esc(title)}</h3><button class="x" data-close type="button" aria-label="Kapat">${ICON.close}</button></div>
    <div class="mbody">${bodyHTML}</div>
    ${footHTML?`<div class="mfoot">${footHTML}</div>`:''}
  </div>`;
  $('#modals').append(ovl);
  const close=()=>ovl.remove();
  ovl.addEventListener('click',e=>{if(e.target===ovl||e.target.closest('[data-close]'))close();});
  return{el:ovl,close};
}

function cartTotals(){
  let gross=0,vat=0,cost=0;
  cart.forEach(l=>{
    const line=l.price*l.qty;
    gross+=line;cost+=l.cost*l.qty;
    vat+=line-line/(1+l.vat/100);
  });
  const disc=gross*(discount/100);
  const net=gross-disc;
  const vatNet=vat*(1-discount/100);
  return{gross,disc,net,vat:vatNet,cost,profit:net-vatNet-cost};
}
function addToCart(p,qty){
  const ex=cart.find(l=>l.id===p.id);
  const add=qty??(p.unit==='kg'?null:1);
  if(p.unit==='kg'&&add===null){askWeight(p);return;}
  if(ex){ex.qty+=add;}else{cart.push({id:p.id,barcode:p.barcode,name:p.name,unit:p.unit,price:p.price,cost:p.cost,vat:p.vat,qty:add});}
  renderPOS();
}
function askWeight(p){
  const m=modal(p.name,`<label class="f"><span>Ağırlık (kg) — kilo fiyatı ${money(p.price)}</span>
    <input id="w" class="mono" type="number" step="0.001" min="0" inputmode="decimal" enterkeyhint="done" value="1.000"></label>
    <div class="seg" style="width:100%;margin-bottom:16px">${[0.25,0.5,1,1.5,2].map(v=>`<button type="button" data-w="${v}">${v} kg</button>`).join('')}</div>
    <div class="lcd"><div class="lbl">Tutar</div><div class="big" id="wt">${money(p.price)}</div></div>`,
    `<button class="btn ghost" data-close type="button">Vazgeç</button><button class="btn" id="ok" type="button">${ICON.plus}Sepete ekle</button>`);
  const w=$('#w',m.el);
  softFocus(w);if(finePointer())w.select();
  const upd=()=>$('#wt',m.el).textContent=money(p.price*(parseFloat(w.value)||0));
  w.oninput=()=>{$$('[data-w]',m.el).forEach(x=>x.classList.remove('on'));upd();};
  $$('[data-w]',m.el).forEach(b=>b.onclick=()=>{
    w.value=Number(b.dataset.w).toFixed(3);
    $$('[data-w]',m.el).forEach(x=>x.classList.toggle('on',x===b));upd();
  });
  const ok=()=>{const v=parseFloat(w.value)||0;if(v>0){m.close();addToCart(p,v);}else toast('Ağırlık girin',true);};
  $('#ok',m.el).onclick=ok;
  w.onkeydown=e=>{if(e.key==='Enter')ok();};
}
function handleBarcode(code){
  if(!code)return;
  const p=byBarcode(code);
  if(p){
    if(p.stock<=0&&p.unit!=='kg') toast(p.name+' stokta görünmüyor',true);
    addToCart(p);
    if(view==='pos')toast(p.name+' eklendi');
    return;
  }
  productForm(null,code,()=>{const np=byBarcode(code);if(np&&view==='pos')addToCart(np);});
}

function todayStats(){
  const d=today();const s=S.sales.filter(x=>dayOf(x.ts)===d);
  return{count:s.length,total:s.reduce((a,x)=>a+x.net,0)};
}
function finishSale(){
  if(!cart.length)return;
  const t=cartTotals();
  let customer='';
  const go=()=>{
    const sale={id:uid(),ts:Date.now(),no:S.sales.length+1,items:cart.map(l=>({...l})),
      gross:t.gross,disc:t.disc,net:t.net,vat:t.vat,cost:t.cost,profit:t.profit,payment,discount,customer};
    cart.forEach(l=>{const p=byId(l.id);if(p)p.stock=+(p.stock-l.qty).toFixed(3);});
    S.sales.push(sale);
    if(payment==='nakit')S.cash.push({id:uid(),ts:sale.ts,type:'giris',amount:t.net,note:'Satış #'+sale.no,ref:sale.id});
    persist();
    const low=cart.map(l=>byId(l.id)).filter(p=>p&&p.unit!=='kg'&&p.stock<=(S.settings.lowStock||5));
    cart=[];discount=0;payment='nakit';
    renderPOS();
    toast('Satış kaydedildi · '+money(sale.net),'good');
    if(low.length)toast('Kritik stok: '+low.map(p=>p.name).join(', '),true);
    receipt(sale);
  };
  if(payment==='veresiye'){
    const m=modal('Veresiye',`<label class="f"><span>Müşteri adı</span>
      <input id="c" placeholder="Ör. Ahmet Bey" enterkeyhint="done" autocomplete="off"></label>
      <p style="font-size:13px;color:var(--muted)">Tutar: <b class="mono">${money(t.net)}</b> — açık hesap olarak muhasebeye işlenir.</p>`,
      `<button class="btn ghost" data-close type="button">Vazgeç</button><button class="btn" id="ok" type="button">${ICON.check}Kaydet</button>`);
    const c=$('#c',m.el);softFocus(c);
    const save=()=>{customer=c.value.trim()||'İsimsiz';m.close();go();};
    c.onkeydown=e=>{if(e.key==='Enter')save();};
    $('#ok',m.el).onclick=save;
  }else go();
}

    return p.name.toLowerCase().includes(f)||String(p.barcode||'').includes(f)||(p.category||'').toLowerCase().includes(f);

    const data={barcode:bc,name,category:$('#c',m.el).value.trim(),unit,

      vat,stock:parseFloat($('#s',m.el).value)||0};

    if(view==='stok')renderStok();
    after&&after();

  setTimeout(()=>softFocus(isNew&&v.barcode?$('#n',m.el):$('#b',m.el)),40);

let period='ay';
function inPeriod(ts){
  const d=new Date(ts),n=new Date();
  if(period==='gun')return dayOf(ts)===today();
  if(period==='hafta')return (n-d)<7*864e5;
  if(period==='ay')return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
  return true;
}
function books(){
  const sales=S.sales.filter(s=>inPeriod(s.ts));
  const purch=S.purchases.filter(p=>inPeriod(p.ts));
  const exp=S.expenses.filter(e=>inPeriod(e.ts));
  const ciro=sales.reduce((a,s)=>a+s.net,0);
  const kdvSat=sales.reduce((a,s)=>a+s.vat,0);
  const smm=sales.reduce((a,s)=>a+s.cost,0);
  const kdvAl=purch.reduce((a,p)=>a+p.vat,0)+exp.reduce((a,e)=>a+e.vat,0);
  const gider=exp.reduce((a,e)=>a+e.amount,0);
  const brut=ciro-kdvSat-smm;
  const kasa=S.cash.reduce((a,c)=>a+(c.type==='giris'?c.amount:-c.amount),0);
  return{sales,purch,exp,ciro,kdvSat,kdvAl,smm,gider,brut,net:brut-gider,kdvOde:Math.max(0,kdvSat-kdvAl),kasa,
    alis:purch.reduce((a,p)=>a+p.total,0),veresiye:S.sales.filter(s=>s.payment==='veresiye').reduce((a,s)=>a+s.net,0)};
}

  const per=days.map(d=>S.sales.filter(s=>dayOf(s.ts)===d).reduce((a,s)=>a+s.net,0));
  const max=Math.max(...per,1);
  const cnt={};
  S.sales.forEach(s=>s.items.forEach(l=>{const k=l.id;cnt[k]=cnt[k]||{name:l.name,qty:0,rev:0,unit:l.unit};cnt[k].qty+=l.qty;cnt[k].rev+=l.price*l.qty;}));
  const top=Object.values(cnt).sort((a,b)=>b.rev-a.rev).slice(0,10);
  const low=S.products.filter(p=>p.stock<=(S.settings.lowStock||5)).sort((a,b)=>a.stock-b.stock);
  const hours={};S.sales.forEach(s=>{const h=new Date(s.ts).getHours();hours[h]=(hours[h]||0)+s.net;});
  const busiest=Object.entries(hours).sort((a,b)=>b[1]-a[1])[0];
  const nakit=S.sales.filter(s=>s.payment==='nakit').reduce((a,s)=>a+s.net,0);

  $('#view').innerHTML=`

    <div class="sub">Toplam ${S.sales.length} satış kaydı üzerinden</div></div></div>
  <div class="stats">
    <div class="stat"><div class="k">Ortalama sepet</div><div class="v">${money(S.sales.length?S.sales.reduce((a,s)=>a+s.net,0)/S.sales.length:0)}</div><div class="n">fiş başına</div></div>
    <div class="stat"><div class="k">En yoğun saat</div><div class="v">${busiest?busiest[0].padStart(2,'0')+':00':'—'}</div><div class="n">${busiest?money(busiest[1]):'veri yok'}</div></div>
    <div class="stat"><div class="k">Nakit</div><div class="v">${money(nakit)}</div><div class="n">Kart ${money(kart)}</div></div>
    <div class="stat ${low.length?'hl':''}"><div class="k">Kritik stok</div><div class="v">${low.length}</div><div class="n">ürün</div></div>
  </div>
  <div class="card pad" style="margin-bottom:18px">
    <div class="eyebrow" style="margin-bottom:8px">Son 7 gün cirosu</div>
    <div class="bars7">${per.map((v,i)=>`<div class="b" title="${money(v)}">
      <s>${v?TL.format(v).replace(',00',''):''}</s>
      <i style="height:${Math.max(2,Math.round(v/max*100))}%"></i>
      <em>${new Date(days[i]).toLocaleDateString('tr-TR',{weekday:'short'})}</em></div>`).join('')}</div>
    <div class="num mono" style="text-align:right;font-size:13px;color:var(--muted);margin-top:10px">Toplam ${money(per.reduce((a,b)=>a+b,0))}</div>
  </div>
  <div class="split">
    <div class="card">
      <div class="pad eyebrow" style="border-bottom:1px solid var(--line)">En çok kazandıran ürünler</div>
      <table class="rt"><thead><tr><th>Ürün</th><th class="num">Satılan</th><th class="num">Ciro</th></tr></thead>
      <tbody>${top.length?top.map(t=>`<tr>
        <td class="rt-title"><b>${esc(t.name)}</b></td>
        <td class="num" data-label="Satılan">${qtyFmt(t.qty,t.unit)}</td>
        <td class="num" data-label="Ciro"><b>${money(t.rev)}</b></td></tr>`).join(''):`<tr><td class="rt-full" colspan="3"><div class="empty">Henüz satış yok.</div></td></tr>`}</tbody></table>
    </div>
    <div class="card">
      <div class="pad eyebrow" style="border-bottom:1px solid var(--line)">Sipariş verilmesi gerekenler</div>
      <table class="rt"><tbody>${low.length?low.map(p=>`<tr>
        <td class="rt-title"><b>${esc(p.name)}</b></td>
        <td class="num" data-label="Kalan"><span class="chip ${p.stock<=0?'bad':'warn'}">${qtyFmt(p.stock,p.unit)}</span></td></tr>`).join(''):`<tr><td class="rt-full"><div class="empty">Raflar dolu görünüyor.</div></td></tr>`}</tbody></table>
    </div>
  </div>`;
}

/* =========================================================
   11. AYARLAR
   ========================================================= */
function renderAyar(){
  const s2=S.settings;
  const th=Theme.get();
  $('#view').innerHTML=`
  <div class="head"><div><div class="eyebrow">Kurulum</div><h1>Ayarlar</h1>
    <div class="sub">Veriler bu cihazda saklanır — düzenli yedek alın</div></div></div>
  <div class="split">
    <div class="card pad">
      <div class="eyebrow" style="margin-bottom:14px">Mağaza</div>
      <label class="f"><span>Mağaza adı</span><input id="shop" value="${esc(s2.shop)}" autocomplete="off"></label>
      <div class="row">
        <label class="f"><span>Varsayılan KDV</span><select id="vat">${[1,10,20].map(x=>`<option value="${x}"${s2.vat==x?' selected':''}>%${x}</option>`).join('')}</select></label>
        <label class="f"><span>Kritik stok sınırı</span><input id="low" class="mono" type="number" inputmode="numeric" value="${s2.lowStock}"></label>
      </div>
      <label class="f"><span>Fiş dipnotu</span><textarea id="foot" rows="2">${esc(s2.footer)}</textarea></label>
      <button class="btn wide" id="saveS" type="button">${ICON.check}Ayarları kaydet</button>
    </div>
    <div class="card pad">
      <div class="eyebrow" style="margin-bottom:14px">Görünüm</div>
      <label class="f"><span>Tema</span>
        <div class="seg" style="width:100%">
          ${[['system','Sistem'],['light','Açık'],['dark','Koyu']].map(([k,l])=>`<button type="button" data-th="${k}" class="${th===k?'on':''}" style="flex:1">${l}</button>`).join('')}
        </div>
        <span class="hint">Sistem seçiliyken cihazınızın gece/gündüz ayarını izler.</span>
      </label>
      <div class="eyebrow" style="margin:22px 0 14px">Veri</div>
      <p style="font-size:13.5px;color:var(--muted);margin:0 0 14px">${S.products.length} ürün · ${S.sales.length} satış · ${S.purchases.length} alış · ${S.expenses.length} gider kaydı.</p>
      <div style="display:grid;gap:10px">
        <button class="btn ghost wide" id="bk" type="button">${ICON.down}Yedek indir (JSON)</button>
        <button class="btn ghost wide" id="rs" type="button">${ICON.up}Yedekten geri yükle</button>
        <button class="btn ghost wide" id="csv" type="button">${ICON.down}Stok listesini CSV indir</button>
        <button class="btn ghost wide" id="demo" type="button">${ICON.box}Örnek ürünleri yükle</button>
        <button class="btn danger wide" id="wipe" type="button">${ICON.trash}Tüm verileri sil</button>
      </div>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </div>
  <div class="card pad" style="margin-top:18px">
    <div class="eyebrow" style="margin-bottom:10px">Barkod okuma hakkında</div>
    <p style="font-size:13.5px;line-height:1.7;margin:0;color:var(--muted)">
    Kamera erişimi için sayfanın <b>https://</b> adresinden veya <b>localhost</b> üzerinden açılması gerekir; telefonda dosyayı doğrudan açarsanız tarayıcı kamerayı engeller.
    Chrome ve Android'de tarayıcının kendi barkod motoru kullanılır (hızlı mod). Safari ve diğerlerinde program <b>EAN-13</b> ve <b>EAN-8</b> barkodlarını kendi çözer (uyumluluk modu) — market ürünlerinin neredeyse tamamı bu formattadır.
    Barkodu yatay, dikey ya da baş aşağı tutabilirsiniz; kare hem yatay hem dikey taranır. Gölge ve eşit olmayan ışık altında da okur, ama net odak şarttır: telefonu ürüne 10-15 cm yaklaştırıp sabit tutun.
    USB veya bluetooth lazer okuyucu takarsanız da çalışır: okuyucu klavye gibi yazdığı için barkod kutusu odaktayken doğrudan sepete düşer.</p>
  </div>
  <div class="card pad" style="margin-top:18px">
    <div class="eyebrow" style="margin-bottom:10px">Klavye kısayolları</div>
    <p style="font-size:13.5px;line-height:1.7;margin:0;color:var(--muted)">
    <b class="mono">F2</b> satış ekranında kamerayı açar · <b class="mono">Esc</b> açık pencereyi kapatır · <b class="mono">Enter</b> barkod kutusunda ürünü sepete atar.</p>
  </div>`;
  $$('[data-th]').forEach(b=>b.onclick=()=>{Theme.set(b.dataset.th);$$('[data-th]').forEach(x=>x.classList.toggle('on',x===b));});
  $('#saveS').onclick=()=>{
    s2.shop=$('#shop').value.trim()||'Market';s2.vat=+$('#vat').value;s2.lowStock=parseFloat($('#low').value)||5;s2.footer=$('#foot').value;
    persist();toast('Ayarlar kaydedildi','good');renderAyar();
  };
  $('#bk').onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='market-yedek-'+today()+'.json';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('Yedek indiriliyor');
  };
  $('#rs').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products)throw 0;S={...clone(DEF),...d};S.settings={...DEF.settings,...(d.settings||{})};persist();toast('Yedek geri yüklendi','good');renderAyar();}catch(err){toast('Dosya okunamadı',true);}};
    r.readAsText(f);
  };
  $('#csv').onclick=()=>{
    const rows=[['barkod','ad','kategori','birim','alis','satis','kdv','stok'],
      ...S.products.map(p=>[p.barcode,p.name,p.category,p.unit,p.cost,p.price,p.vat,p.stock])];
    const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='stok-'+today()+'.csv';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  $('#demo').onclick=()=>{loadDemo();persist();toast('Örnek ürünler eklendi','good');renderAyar();};
  $('#wipe').onclick=()=>{if(confirm('Tüm ürün, satış ve muhasebe kayıtları silinecek. Emin misiniz?')){S=clone(DEF);cart=[];buy=[];persist();toast('Veriler silindi');renderAyar();}};
}

/* =========================================================
   12. Yönlendirme
   ========================================================= */
const VIEWS={pos:renderPOS,stok:renderStok,alis:renderAlis,muhasebe:renderMuhasebe,rapor:renderRapor,ayar:renderAyar};
function go(v){
  if(!VIEWS[v])v='pos';
  view=v;
  $$('[data-v]').forEach(b=>{
    const on=b.dataset.v===v;
    b.classList.toggle('on',on);
    b.setAttribute('aria-current',on?'page':'false');
  });
  VIEWS[v]();
  window.scrollTo(0,0);
}
$$('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const o=$$('.ovl').pop();if(o){Scanner.el===o?Scanner.close():o.remove();}}
  if(e.key==='F2'&&view==='pos'){e.preventDefault();Scanner.open(handleBarcode);}
});
// dekoratif barkod şeridi
$$('.bars').forEach(el=>el.innerHTML=[3,7,2,9,4,2,6,3,8,2,5].map(h=>`<i style="height:${h*2.4}px"></i>`).join(''));
Theme.init();

(async()=>{
  const saved=await Store.load();
  if(saved&&saved.products){S={...clone(DEF),...saved};S.settings={...DEF.settings,...(saved.settings||{})};}
  else{loadDemo();persist();}
  go('pos');
})();
</script>
